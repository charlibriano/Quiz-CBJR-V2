/* ═══════════════════════════════════════════════════════
   CARROSSEL DE CONQUISTAS
   ═══════════════════════════════════════════════════════ */

/* Esconde o grid original — substituído pelos carrosséis */
.grid { display: none !important; }

/* Container geral dos carrosséis */
#carouselContainer {
  width: min(1180px, 96vw);
  margin: 0 auto 24px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.ach-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  padding: 0 2px;
}

.ach-section-title {
  font-family: Elektrix, Inter, sans-serif;
  font-size: clamp(1.1rem, 2.5vw, 1.65rem);
  color: var(--yellow);
  text-shadow: 0 0 18px rgba(241,196,15,.28);
  line-height: 1;
  margin: 0;
}

.ach-section-count {
  font-size: .72rem;
  font-weight: 1000;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.52);
  white-space: nowrap;
}

.ach-track {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  padding: 6px 4px 14px;
}
.ach-track::-webkit-scrollbar { display: none; }

/* Card do carrossel */
.ach-card {
  flex: 0 0 200px;
  width: 200px;
  scroll-snap-align: start;
  position: relative;
  isolation: isolate;
  border-radius: 20px;
  border: 1px solid rgba(241,196,15,.20);
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.78));
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 14px 40px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.07);
  transition: .2s ease;
  display: flex;
  flex-direction: column;
}

.ach-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(241,196,15,.22), transparent 48%);
  opacity: .22;
  z-index: 0;
  transition: .2s ease;
}

.ach-card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: rgba(241,196,15,.60);
  box-shadow: 0 0 28px rgba(241,196,15,.16), 0 20px 44px rgba(0,0,0,.58);
}
.ach-card:hover::before { opacity: .72; }

.ach-card.locked {
  opacity: .52;
  filter: grayscale(.55);
}
.ach-card.locked:hover {
  transform: translateY(-2px);
  border-color: rgba(241,196,15,.28);
  filter: grayscale(.35);
}
.ach-card.unlocked {
  border-color: rgba(30,215,96,.50);
  box-shadow: 0 0 22px rgba(30,215,96,.10), 0 14px 40px rgba(0,0,0,.52);
}

.ach-cover {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #111;
  border-bottom: 1px solid rgba(255,255,255,.08);
  filter: brightness(.52) grayscale(.55);
  transition: .25s ease;
  position: relative;
  z-index: 1;
}
.ach-card.unlocked .ach-cover { filter: brightness(.85); }
.ach-card:hover .ach-cover { filter: brightness(.96) grayscale(0); }
.ach-card.locked:hover .ach-cover { filter: brightness(.62) grayscale(.35); }

.ach-badge {
  position: absolute;
  top: 9px; left: 9px;
  z-index: 3;
  border: 1px solid rgba(241,196,15,.52);
  background: rgba(0,0,0,.78);
  color: var(--yellow);
  border-radius: 999px;
  padding: 4px 7px;
  font-size: .60rem;
  font-weight: 1000;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ach-card.unlocked .ach-badge { border-color: rgba(30,215,96,.72); color: var(--green); }

.ach-icon {
  position: absolute;
  top: 9px; right: 9px;
  z-index: 3;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(0,0,0,.76);
  border: 1px solid rgba(255,255,255,.16);
  font-size: 1rem;
}

.ach-info {
  position: relative;
  z-index: 1;
  padding: 10px 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.ach-name {
  margin: 0;
  color: #fff;
  font-family: Elektrix, Inter, sans-serif;
  font-size: .88rem;
  line-height: 1.1;
}

.ach-desc {
  margin: 0;
  color: rgba(255,255,255,.60);
  font-weight: 800;
  font-size: .68rem;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.ach-meta {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 4px;
}

.ach-xp, .ach-rarity {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 3px 7px;
  font-size: .60rem;
  font-weight: 1000;
  letter-spacing: .05em;
  text-transform: uppercase;
  border: 1px solid rgba(241,196,15,.28);
  background: rgba(0,0,0,.50);
  color: var(--yellow);
}
.ach-rarity { color: rgba(255,255,255,.72); border-color: rgba(255,255,255,.16); }
.ach-rarity.rara { color: var(--blue); border-color: rgba(52,152,219,.42); }
.ach-rarity.epica { color: var(--purple); border-color: rgba(155,89,182,.50); }
.ach-rarity.lendaria { color: var(--yellow); border-color: rgba(241,196,15,.58); box-shadow: 0 0 14px rgba(241,196,15,.10); }

.ach-status {
  margin-top: auto;
  padding-top: 6px;
  font-size: .60rem;
  font-weight: 1000;
  color: rgba(255,255,255,.42);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ach-card.unlocked .ach-status { color: var(--green); }

/* Dots de navegação */
.ach-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 2px;
  min-height: 16px;
}

.ach-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,.20);
  transition: background .2s, transform .2s;
  border: none;
  padding: 0;
  cursor: pointer;
}
.ach-dot.active {
  background: var(--yellow);
  transform: scale(1.4);
  box-shadow: 0 0 8px rgba(241,196,15,.50);
}

.ach-empty {
  padding: 22px;
  border: 1px solid rgba(241,196,15,.22);
  border-radius: 18px;
  text-align: center;
  background: rgba(0,0,0,.42);
  color: rgba(255,255,255,.62);
  font-weight: 900;
  font-size: .88rem;
}

@media (max-width: 680px) {
  .ach-card { flex: 0 0 72vw; width: 72vw; max-width: 280px; }
  .ach-section-title { font-size: 1.1rem; }
}
@media (min-width: 1080px) {
  .ach-card { flex: 0 0 210px; width: 210px; }
}

const BASE_URL = './';

const catalog = [

  {id:'letters_tcp_completed',cat:'letras',icon:'✍️',name:'Transpiração Contínua Prolongada',desc:'Complete o Modo Letras de Transpiração Contínua Prolongada.',cover:'CD 1.jpeg'},

  {id:'letters_nadando_completed',cat:'letras',icon:'✍️',name:'Nadando com os Tubarões',desc:'Complete o Modo Letras de Nadando com os Tubarões.',cover:'CD 3.jpeg'},
  {id:'letters_cbjr100_completed',cat:'letras',icon:'✍️',name:'100% Charlie Brown Jr.',desc:'Complete o Modo Letras de 100% Charlie Brown Jr.',cover:'CD 4.jpeg'},
  {id:'letters_bocas_completed',cat:'letras',icon:'✍️',name:'Bocas Ordinárias',desc:'Complete o Modo Letras de Bocas Ordinárias.',cover:'CD 5.jpeg'},
  {id:'letters_atividade_completed',cat:'letras',icon:'✍️',name:'Tamo Aí na Atividade',desc:'Complete o Modo Letras de Tamo Aí na Atividade.',cover:'CD 7.jpeg'},
  {id:'letters_imunidade_completed',cat:'letras',icon:'✍️',name:'Imunidade Musical',desc:'Complete o Modo Letras de Imunidade Musical.',cover:'CD 8.jpeg'},
  {id:'letters_ritmo_completed',cat:'letras',icon:'✍️',name:'Ritmo, Ritual e Responsa',desc:'Complete o Modo Letras de Ritmo, Ritual e Responsa.',cover:'CD 9.jpeg'},
  {id:'letters_all_completed',cat:'letras',icon:'📚',name:'Coleção Completa',desc:'Complete o Modo Letras para todos os álbuns disponíveis.',cover:'CD 13.jpeg'}
];

const catNames = {all:'Todas',unlocked:'Liberadas',locked:'Bloqueadas',radio:'Rádio',quiz:'Quiz',letras:'Letras'};

const XP_MAP = {
  first_cd:120, unlocked_next:80, no_miss:180, ninety:160, perfect:250, hard:220, three_cds:180, half_radio:300,
  bonus_music_master:400, bonus_album_perfectionist:420, bonus_hard_album_completed:450, bonus_fast_guess:220, bonus_all_albums_completed:1000,
  first_level_completed:100, combo_3x:80, level_3_completed:130, all_main_levels_completed:450, level_5_completed:160, all_levels_completed:700,
  combo_7x:180, combo_5x:120, used_50_50:60, coca_cola_collaboration:160, combo_10x:260, new_high_score:180, secret_level_completed:500, used_skip:60,
  letters_tcp_completed:120, letters_pcpl_completed:120, letters_nadando_completed:140, letters_cbjr100_completed:150, letters_bocas_completed:150,
  letters_atividade_completed:150, letters_imunidade_completed:160, letters_ritmo_completed:170, letters_all_completed:800
};
function achievementXP(id){ return XP_MAP[id] || 100; }
function achievementRarity(id){
  const xp = achievementXP(id);
  if (xp >= 700) return {label:'Lendária', cls:'lendaria'};
  if (xp >= 350) return {label:'Épica', cls:'epica'};
  if (xp >= 160) return {label:'Rara', cls:'rara'};
  return {label:'Comum', cls:'comum'};
}

let activeFilter = 'all';
let state = {};

function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){return {}}}
function normalizeState(){
  const radio = readJson(RADIO_KEY);
  const old = readJson(OLD_QUIZ_KEY);
  const auto = readJson('cbjr_auto_achievements_v1');
  let lettersCompleted = [];
  try { lettersCompleted = JSON.parse(localStorage.getItem('cbjr_letters_completed') || '[]'); } catch(e) { lettersCompleted = []; }

  const merged = {};
  const mark = (id, source = 'auto') => {
    if (!id) return;
    if (!merged[id]) merged[id] = { unlockedAt: Date.now(), source };
  };

  Object.keys(old).forEach(id => { if(old[id]) merged[id] = {unlockedAt: old[id]?.unlockedAt || Date.now(), source:'quiz'}; });
  Object.keys(radio).forEach(id => { if(radio[id]) merged[id] = typeof radio[id] === 'object' ? {...radio[id], source:'radio'} : {unlockedAt: Date.now(), source:'radio'}; });

  // Conquistas automáticas gravadas pelo painel principal
  const autoMap = {
    first_login: 'first_login',
    radio_first_cd: 'first_cd',
    radio_three_cds: 'three_cds',
    radio_half: 'half_radio',
    radio_hard: 'hard',
    letras_first_album: 'letters_tcp_completed',
    letras_three_albums: 'letters_nadando_completed',
    letras_half: 'letters_imunidade_completed',
    quiz_primeira_medalha: 'new_high_score',
    familia_013: 'letters_all_completed'
  };
  Object.keys(auto).forEach(id => {
    if(auto[id]) {
      const target = autoMap[id] || id;
      merged[target] = { unlockedAt: auto[id]?.unlockedAt || Date.now(), source:'auto' };
    }
  });

  // Deriva conquistas da Rádio pelo progresso salvo
  const radioIndex = Number(localStorage.getItem('radioCBJRUnlockedAlbumIndex_v2') || '0') || 0;
  const radioLiberados = Math.min(13, Math.max(1, radioIndex + 1));
  const radioMode = String(localStorage.getItem('radioCBJRMode') || 'normal').toLowerCase();
  if (radioLiberados >= 2) { mark('first_cd','radio-progress'); mark('unlocked_next','radio-progress'); }
  if (radioLiberados >= 3) mark('three_cds','radio-progress');
  if (radioLiberados >= 7) mark('half_radio','radio-progress');
  if (radioLiberados >= 13) mark('bonus_all_albums_completed','radio-progress');
  if (radioMode === 'hard') mark('hard','radio-progress');

  // Deriva conquistas do Modo Letras pelos álbuns concluídos
  const letterMap = {
    tcp: 'letters_tcp_completed',
    pcpl: 'letters_pcpl_completed',
    nadando: 'letters_nadando_completed',
    cbjr100: 'letters_cbjr100_completed',
    bocas: 'letters_bocas_completed',
    atividade: 'letters_atividade_completed',
    imunidade: 'letters_imunidade_completed',
    ritmo: 'letters_ritmo_completed'
  };
  if (Array.isArray(lettersCompleted)) {
    lettersCompleted.forEach(id => mark(letterMap[id] || '', 'letras-progress'));
    if (lettersCompleted.length >= 8) mark('letters_all_completed', 'letras-progress');
  }

  return merged;
}
function encodePath(file){
  return String(file || 'CD 1.jpeg').replace(/^\/+/, '').split('/').map(part => encodeURIComponent(part)).join('/');
}
function coverCandidates(file){
  const encoded = encodePath(file);
  const original = String(file || 'CD 1.jpeg').replace(/^\/+/, '');
  const cache = '?v=20260511-radio-covers-3';
  return [
    BASE_URL + encoded + cache,
    PAGES_V2 + encoded + cache,
    RAW_V2 + encoded + cache,
    PAGES_V1 + encoded + cache,
    RAW_V1 + encoded + cache,
    BASE_URL + original + cache,
    PAGES_V2 + 'cbjr.png' + cache,
    RAW_V2 + 'cbjr.png' + cache
  ];
}
function coverUrl(file){
  return coverCandidates(file)[0];
}
function fallbackCover(img){
  if(!img) return;
  const original = img.dataset.originalCover || 'CD 1.jpeg';
  const candidates = coverCandidates(original);
  const step = Number(img.dataset.fallbackStep || 0) + 1;
  if(step < candidates.length){
    img.dataset.fallbackStep = String(step);
    img.src = candidates[step];
    return;
  }
  img.classList.add('cover-error');
}
function isUnlocked(id){ return Boolean(state[id]); }
function formatDate(value){
  const ts = Number(value || 0);
  if(!ts) return 'Data não registrada';
  try{return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return 'Data não registrada'}
}
function render(){
  state = normalizeState();
  const total = catalog.length;
  const unlocked = catalog.filter(a => isUnlocked(a.id)).length;
  const percent = total ? Math.round((unlocked/total)*100) : 0;
  const xpTotal = catalog.filter(a => isUnlocked(a.id)).reduce((sum,a)=>sum+achievementXP(a.id),0);
  document.getElementById('totalCount').textContent = total;
  document.getElementById('unlockedCount').textContent = unlocked;
  document.getElementById('percentCount').textContent = percent + '%';
  const xpEl = document.getElementById('xpCount'); if (xpEl) xpEl.textContent = xpTotal;
  document.getElementById('progressFill').style.width = percent + '%';

  // Filtro
  const rows = catalog.filter(a => activeFilter === 'all' || (activeFilter === 'unlocked' ? isUnlocked(a.id) : activeFilter === 'locked' ? !isUnlocked(a.id) : a.cat === activeFilter))
    .sort((a,b) => Number(isUnlocked(b.id)) - Number(isUnlocked(a.id)) || a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));

  // Grid original (oculto por CSS, mantido para compatibilidade)
  const grid = document.getElementById('achievementsGrid');
  if(grid) grid.innerHTML = '';

  // Carrosséis
  renderCarousels(rows);
}

// Nomes de exibição das categorias
const sectionLabels = { radio: 'Rádio CBJR', quiz: 'Quiz CBJR', letras: 'Modo Letras' };

function renderCarousels(rows) {
  const container = document.getElementById('carouselContainer');
  if (!container) return;
  container.innerHTML = '';

  if (!rows.length) {
    container.innerHTML = '<div class="ach-empty">Nenhuma conquista encontrada nessa categoria.</div>';
    return;
  }

  // Agrupa por categoria preservando a ordem de exibição
  const catOrder = ['radio','quiz','letras'];
  const grouped = {};
  rows.forEach(a => {
    if (!grouped[a.cat]) grouped[a.cat] = [];
    grouped[a.cat].push(a);
  });

  // Se filtro ativo não é "all" e é uma categoria, mostra só ela em seção única
  const cats = catOrder.filter(c => grouped[c]);

  cats.forEach(cat => {
    const items = grouped[cat];
    const unlockedInCat = items.filter(a => isUnlocked(a.id)).length;
    const section = document.createElement('section');
    section.className = 'ach-section';

    const labelName = sectionLabels[cat] || catNames[cat] || cat;

    section.innerHTML = `
      <div class="ach-section-head">
        <h2 class="ach-section-title">${escapeHtml(labelName)}</h2>
        <span class="ach-section-count">${unlockedInCat} / ${items.length} liberadas</span>
      </div>
      <div class="ach-track" id="track-${cat}">
        ${items.map(a => buildCard(a)).join('')}
      </div>
      <div class="ach-dots" id="dots-${cat}"></div>
    `;

    container.appendChild(section);

    // Dots e scroll listener
    requestAnimationFrame(() => buildDots(`track-${cat}`, `dots-${cat}`));

    // Clique nos cards
    section.querySelectorAll('.ach-card').forEach(card => {
      card.addEventListener('click', () => openModal(card.dataset.id));
    });
  });
}

function buildCard(a) {
  const unlocked = isUnlocked(a.id);
  const data = state[a.id] || {};
  const xp = achievementXP(a.id);
  const rarity = achievementRarity(a.id);
  const statusText = unlocked ? '✓ ' + formatDate(data.unlockedAt) : 'Bloqueada';

  return `<article class="ach-card ${unlocked ? 'unlocked' : 'locked'}" data-id="${escapeHtml(a.id)}">
    <span class="ach-badge">${escapeHtml(catNames[a.cat] || a.cat)}</span>
    <span class="ach-icon">${unlocked ? a.icon : '🔒'}</span>
    <img class="ach-cover" src="${coverUrl(a.cover)}" data-original-cover="${escapeHtml(a.cover)}" alt="${escapeHtml(a.name)}" onerror="fallbackCover(this)" loading="lazy">
    <div class="ach-info">
      <h3 class="ach-name">${escapeHtml(a.name)}</h3>
      <p class="ach-desc">${escapeHtml(a.desc)}</p>
      <div class="ach-meta">
        <span class="ach-xp">+${xp} XP</span>
        <span class="ach-rarity ${rarity.cls}">${escapeHtml(rarity.label)}</span>
      </div>
      <div class="ach-status">${escapeHtml(statusText)}</div>
    </div>
  </article>`;
}

function buildDots(trackId, dotsId) {
  const track = document.getElementById(trackId);
  const dotsEl = document.getElementById(dotsId);
  if (!track || !dotsEl) return;

  const cards = track.querySelectorAll('.ach-card');
  const count = cards.length;
  if (count <= 1) { dotsEl.innerHTML = ''; return; }

  // Dots: um por card (máx 13)
  const dotCount = Math.min(count, 13);
  dotsEl.innerHTML = Array.from({length: dotCount}, (_,i) =>
    `<button class="ach-dot${i===0?' active':''}" aria-label="Item ${i+1}"></button>`
  ).join('');

  const dots = dotsEl.querySelectorAll('.ach-dot');

  // Scroll → atualiza dot ativo
  const onScroll = () => {
    const cardW = cards[0]?.offsetWidth + 14 || 214;
    const idx = Math.min(dotCount - 1, Math.round(track.scrollLeft / cardW));
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  };
  track.addEventListener('scroll', onScroll, { passive: true });

  // Clique no dot → scroll
  dots.forEach((dot, i) => {
    dot.addEventListener('click', () => {
      const cardW = cards[0]?.offsetWidth + 14 || 214;
      track.scrollTo({ left: i * cardW, behavior: 'smooth' });
    });
  });
}
window.renderAchievements = render;
window.renderGrid = render;
window.addEventListener('cbjr-progress-loaded', render);
function openModal(id){
  const a = catalog.find(x => x.id === id); if(!a) return;
  const data = state[id] || {};
  const unlocked = isUnlocked(id);
  const modalImg = document.getElementById('modalCover');
  modalImg.classList.remove('cover-error');
  modalImg.dataset.fallbackStep = '0';
  modalImg.dataset.originalCover = a.cover;
  modalImg.src = coverUrl(a.cover);
  document.getElementById('modalTitle').textContent = a.name;
  document.getElementById('modalDesc').textContent = a.desc;
  document.getElementById('modalCategory').textContent = catNames[a.cat];
  document.getElementById('modalStatus').textContent = unlocked ? 'Desbloqueada' : 'Bloqueada';
  document.getElementById('modalStatus').style.color = unlocked ? 'var(--green)' : 'rgba(255,255,255,.72)';
  const modalXPEl = document.getElementById('modalXP'); if (modalXPEl) modalXPEl.textContent = '+' + achievementXP(a.id) + ' XP';
  const modalRarityEl = document.getElementById('modalRarity'); if (modalRarityEl) { const rarity = achievementRarity(a.id); modalRarityEl.textContent = rarity.label; modalRarityEl.className = 'chip rarity-chip ' + rarity.cls; }
  const modalDateEl = document.getElementById('modalDate');
  if(unlocked){
    modalDateEl.textContent = formatDate(data.unlockedAt);
  } else {
    // When locked, display a button that navigates the user to the appropriate game page
    modalDateEl.innerHTML = '<button class="btn" onclick="playAchievement(\'' + id + '\')">Jogue para liberar</button>';
  }
  document.getElementById('detailModal').classList.add('show');
}
function closeModal(){ document.getElementById('detailModal').classList.remove('show'); }

// Redireciona o jogador para a tela de jogo apropriada para liberar a conquista.
// Ajuste os caminhos conforme necessário para seu projeto. Aqui usamos páginas base como placeholders.
function playAchievement(id){
  const ach = catalog.find(a => a.id === id);
  if(!ach) return;

  let targetPage;
  let params = '';

  switch(ach.cat){
    case 'radio':
      targetPage = 'radio.html';
      // Conquistas que exigem modo Hard na Rádio
      if(['hard','bonus_hard_album_completed'].includes(id)){
        params = '?mode=hard';
      }
      break;
    case 'quiz':
      targetPage = 'quiz.html';
      // Conquistas que exigem modo Difícil no Quiz
      if(['secret_level_completed'].includes(id)){
        params = '?difficulty=dificil';
      }
      // Conquista de completar sem power-ups — abre quiz normal
      if(id === 'coca_cola_collaboration'){
        params = '?nopowerup=1';
      }
      break;
    case 'letras':
      targetPage = 'letras.html';
      break;
    default:
      targetPage = 'index.html?skipIntro=true';
  }
  window.location.href = BASE_URL + targetPage + params;
}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function resetAchievements(){
  if(!confirm('Zerar as conquistas locais salvas neste navegador?')) return;
  localStorage.removeItem(RADIO_KEY);
  localStorage.removeItem(OLD_QUIZ_KEY);
  localStorage.removeItem('cbjr_auto_achievements_v1');
  closeModal();
  render();
}
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); activeFilter = btn.dataset.filter; render();
}));
document.getElementById('detailModal').addEventListener('click', e => { if(e.target.id === 'detailModal') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
render();
</script>

<script type="module" id="cbjr-auth-profile-script">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    // CORREÇÃO CBJR: config unificada com o restante do site. A config antiga
    // usava outra apiKey/appId e era a primeira a inicializar o app nesta
    // página — o Auth não encontrava a sessão Google do jogador.
    apiKey: 'AIzaSyCT1btbLIMehCj3xldw5LOB-snjyF4SKhw',
    authDomain: 'ranking-cbjr.firebaseapp.com',
    databaseURL: 'https://ranking-cbjr-default-rtdb.firebaseio.com',
    projectId: 'ranking-cbjr',
    storageBucket: 'ranking-cbjr.firebasestorage.app',
    messagingSenderId: '681180179118',
    appId: '1:681180179118:web:fe10833848e8bb8194db3f',
    measurementId: 'G-QK5QE2Y1CC'
  };
  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const box = document.getElementById('cbjrAuthProfile');

  function escapeHtml(str) { return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  function initials(name, email) {
    const source = String(name || email || 'CB').trim();
    const parts = source.split(/\s+/).filter(Boolean);
    return (parts.length >= 2 ? parts[0][0] + parts[1][0] : source.slice(0,2)).toUpperCase();
  }
  async function saveUser(user) {
    try {
      await setDoc(doc(db, 'usuarios', user.uid), {
        uid: user.uid, nome: user.displayName || 'Fã CBJR', email: user.email || '', foto: user.photoURL || '',
        provider: 'google', ultimoLogin: serverTimestamp()
      }, { merge: true });
    } catch (err) { console.warn('CBJR: não foi possível salvar usuário agora.', err); }
  }
  function fillForms(user) {
    const name = user?.displayName || '';
    const email = user?.email || '';
    const photo = user?.photoURL || '';
    const firstName = name.split(' ')[0] || name;
    const nameFields = ['fanName','playerName','nomeJogador','userNameInput'];
    nameFields.forEach(id => { const el = document.getElementById(id); if (el && !el.value) el.value = firstName || name; });
    const photoEl = document.getElementById('fanPhoto'); if (photoEl && !photoEl.value) photoEl.value = photo;
    const emailEl = document.getElementById('fanEmail'); if (emailEl && !emailEl.value) emailEl.value = email;
  }
  function renderLoggedOut() {
    window.CBJR_AUTH_USER = null;
    window.dispatchEvent(new CustomEvent('cbjr-auth-change', { detail: { user: null } }));
    if (!box) return;
    box.classList.remove('show','open');
    box.innerHTML = '';
  }
  function renderLoggedIn(user) {
    window.CBJR_AUTH_USER = user;
    window.dispatchEvent(new CustomEvent('cbjr-auth-change', { detail: { user } }));
    if (!box) return;
    const name = user.displayName || 'Fã CBJR';
    const email = user.email || '';
    const photo = user.photoURL || '';
    box.classList.add('show');
    box.innerHTML = `
      <button class="cbjr-auth-trigger" type="button" aria-label="Abrir opções da conta Google">
        ${photo ? `<img src="${escapeHtml(photo)}" alt="Foto de ${escapeHtml(name)}">` : `<span class="cbjr-auth-fallback">${escapeHtml(initials(name,email))}</span>`}
        <span class="cbjr-auth-text"><strong class="cbjr-auth-name">${escapeHtml(name)}</strong><span class="cbjr-auth-email">${escapeHtml(email)}</span></span>
        <span class="cbjr-auth-caret">▾</span>
      </button>
      <div class="cbjr-auth-menu" role="menu">
        <div class="cbjr-auth-menu-title"><strong>Conta conectada</strong>${escapeHtml(email)}</div>
        <a href="index.html?skipIntro=true">🏠 Menu principal</a>
        <a href="ranking.html">🏆 Meu ranking</a>
        <a href="fans.html">💬 Comunidade</a>
        <button class="cbjr-auth-logout" type="button">🚪 Sair da conta Google</button>
      </div>`;
    box.querySelector('.cbjr-auth-trigger')?.addEventListener('click', (ev) => { ev.stopPropagation(); box.classList.toggle('open'); });
    box.querySelector('.cbjr-auth-logout')?.addEventListener('click', async () => { try { await signOut(auth); window.location.href = 'index.html'; } catch(e) { console.error(e); } });
    fillForms(user);
  }
  document.addEventListener('click', (ev) => { if (box && !box.contains(ev.target)) box.classList.remove('open'); });
  onAuthStateChanged(auth, user => { if (user) { renderLoggedIn(user); saveUser(user); } else { renderLoggedOut(); } });
</script>

<script type="module" id="cbjr-cloud-progress-script">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyCT1btbLIMehCj3xldw5LOB-snjyF4SKhw',
    authDomain: 'ranking-cbjr.firebaseapp.com',
    databaseURL: 'https://ranking-cbjr-default-rtdb.firebaseio.com',
    projectId: 'ranking-cbjr',
    storageBucket: 'ranking-cbjr.firebasestorage.app',
    messagingSenderId: '681180179118',
    appId: '1:681180179118:web:fe10833848e8bb8194db3f',
    measurementId: 'G-QK5QE2Y1CC'
  };

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const PAGE_NAME = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  const PROGRESS_KEYS = [
    'radioCBJRUnlockedAlbumIndex_v2',
    'radioCBJRMode',
    'radioCBJR_achievements_v1',
    'cbjr_letters_completed',
    'lettersCBJR_playerName',
    'cobjr_quiz_achievements',
    'cbjr_auto_achievements_v1'
  ];

  let currentUser = null;
  let cloudReady = false;
  let syncing = false;
  let saveTimer = null;

  function safeJsonParse(value, fallback) {
    try { return JSON.parse(value); } catch (_) { return fallback; }
  }

  function readLocalProgress() {
    const data = {};
    PROGRESS_KEYS.forEach(key => {
      const value = localStorage.getItem(key);
      if (value !== null) data[key] = value;
    });
    return data;
  }

  function mergeObjectString(localValue, remoteValue) {
    const localObj = safeJsonParse(localValue || '{}', {});
    const remoteObj = safeJsonParse(remoteValue || '{}', {});
    return JSON.stringify({ ...remoteObj, ...localObj });
  }

  function mergeArrayString(localValue, remoteValue) {
    const localArr = safeJsonParse(localValue || '[]', []);
    const remoteArr = safeJsonParse(remoteValue || '[]', []);
    return JSON.stringify([...new Set([...(Array.isArray(remoteArr) ? remoteArr : []), ...(Array.isArray(localArr) ? localArr : [])])]);
  }

  function mergeProgress(localData, remoteData, user) {
    const merged = { ...(remoteData || {}), ...(localData || {}) };

    const localRadio = Number(localData.radioCBJRUnlockedAlbumIndex_v2 ?? 0);
    const remoteRadio = Number(remoteData.radioCBJRUnlockedAlbumIndex_v2 ?? 0);
    merged.radioCBJRUnlockedAlbumIndex_v2 = String(Math.max(Number.isFinite(localRadio) ? localRadio : 0, Number.isFinite(remoteRadio) ? remoteRadio : 0));

    merged.radioCBJR_achievements_v1 = mergeObjectString(localData.radioCBJR_achievements_v1, remoteData.radioCBJR_achievements_v1);
    merged.cobjr_quiz_achievements = mergeObjectString(localData.cobjr_quiz_achievements, remoteData.cobjr_quiz_achievements);
    merged.cbjr_letters_completed = mergeArrayString(localData.cbjr_letters_completed, remoteData.cbjr_letters_completed);

    if (!merged.lettersCBJR_playerName && user?.displayName) {
      merged.lettersCBJR_playerName = user.displayName.split(' ')[0] || user.displayName;
    }
    if (!merged.radioCBJRMode) merged.radioCBJRMode = 'normal';

    return merged;
  }

  function applyProgressToLocal(data) {
    syncing = true;
    try {
      Object.entries(data || {}).forEach(([key, value]) => {
        if (PROGRESS_KEYS.includes(key) && value !== undefined && value !== null) {
          localStorage.setItem(key, String(value));
        }
      });
    } finally {
      syncing = false;
    }
  }

  function refreshCurrentPageUI() {
    try { window.renderProgress?.(); } catch (_) {}
    try { window.showSelection?.(); } catch (_) {}
    try { window.updateLettersDashboard?.(); } catch (_) {}
    try { window.renderAchievements?.(); } catch (_) {}
    try { window.renderGrid?.(); } catch (_) {}
    try { window.renderSummary?.(); } catch (_) {}
    try { window.CBJRRanking?.reload?.(); } catch (_) {}
    try { window.dispatchEvent(new CustomEvent('cbjr-progress-loaded')); } catch (_) {}
  }

  function progressDocRef(user) {
    return doc(db, 'usuarios', user.uid, 'progresso', 'geral');
  }

  async function saveCloudProgressNow(extra = {}) {
    if (!currentUser || syncing) return;
    const payload = readLocalProgress();
    try {
      await setDoc(progressDocRef(currentUser), {
        ...payload,
        ...extra,
        uid: currentUser.uid,
        email: currentUser.email || '',
        displayName: currentUser.displayName || '',
        photoURL: currentUser.photoURL || '',
        updatedAt: serverTimestamp(),
        origem: PAGE_NAME
      }, { merge: true });
    } catch (error) {
      console.warn('CBJR cloud progress: não foi possível salvar agora.', error);
    }
  }

  function scheduleSaveCloudProgress() {
    if (!cloudReady || !currentUser || syncing) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveCloudProgressNow(), 450);
  }

  const nativeSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function patchedSetItem(key, value) {
    nativeSetItem(key, value);
    if (PROGRESS_KEYS.includes(key)) scheduleSaveCloudProgress();
  };

  window.CBJRCloudProgress = {
    keys: PROGRESS_KEYS,
    reload: async () => currentUser && loadCloudProgress(currentUser),
    save: saveCloudProgressNow,
    getLocal: readLocalProgress
  };

  async function loadCloudProgress(user) {
    currentUser = user;
    if (!user) return;

    try {
      const snap = await getDoc(progressDocRef(user));
      const remoteData = snap.exists() ? (snap.data() || {}) : {};
      const localData = readLocalProgress();
      const merged = mergeProgress(localData, remoteData, user);
      applyProgressToLocal(merged);
      cloudReady = true;
      await saveCloudProgressNow({ primeiroSync: snap.exists() ? false : true });
      refreshCurrentPageUI();
      console.info('CBJR: progresso sincronizado com a conta Google.');
    } catch (error) {
      cloudReady = true;
      console.warn('CBJR cloud progress: falha ao carregar progresso remoto.', error);
    }
  }

  onAuthStateChanged(auth, user => {
    currentUser = user || null;
    if (user) loadCloudProgress(user);
  });

  window.addEventListener('beforeunload', () => {
    if (currentUser && cloudReady) {
      try {
        const data = readLocalProgress();
        const blob = new Blob([JSON.stringify({ ...data, uid: currentUser.uid, updatedAtMs: Date.now(), origem: PAGE_NAME })], { type: 'application/json' });
        navigator.sendBeacon?.('/__cbjr_progress_ping', blob);
      } catch (_) {}
      saveCloudProgressNow();
    }
  });
</script>
