r{transform:translateY(-3px);border-color:rgba(241,196,15,.58)}.card:hover::before{opacity:.72}.card.locked{opacity:.54;filter:grayscale(.5)}.card.unlocked{border-color:rgba(30,215,96,.56);box-shadow:0 0 30px rgba(30,215,96,.10),0 18px 54px rgba(0,0,0,.52)}.cover{display:block;width:100%;aspect-ratio:1/1;border-radius:16px;object-fit:cover;background:#111;border:1px solid rgba(255,255,255,.12);filter:brightness(.55) grayscale(.55);transition:.25s ease}.card.unlocked .cover{filter:none}.cover-error{opacity:.18}.badge{position:absolute;top:10px;left:10px;border:1px solid rgba(241,196,15,.52);background:rgba(0,0,0,.76);color:var(--yellow);border-radius:999px;padding:5px 8px;font-size:.58rem;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;z-index:3}.card.unlocked .badge{border-color:rgba(30,215,96,.75);color:var(--green)}.icon{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.74);border:1px solid rgba(255,255,255,.16);font-size:1.1rem;z-index:3}.card h3{margin:0;color:#fff;font-family:Elektrix,Inter,sans-serif;font-size:clamp(1.06rem,1.6vw,1.35rem);line-height:.94}.card p{margin:0;color:rgba(255,255,255,.68);font-weight:800;font-size:.78rem;line-height:1.28}.status{align-self:end;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(0,0,0,.48);padding:7px 9px;text-align:center;font-weight:1000;font-size:.72rem;color:rgba(255,255,255,.72)}.unlocked .status{color:var(--green);border-color:rgba(30,215,96,.40)}.empty{width:min(1180px,96vw);margin:0 auto;border:1px solid rgba(241,196,15,.25);border-radius:22px;padding:24px;text-align:center;background:rgba(0,0,0,.62);font-weight:900;color:rgba(255,255,255,.72)}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.82);backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(760px,96vw);border:1px solid var(--line);border-radius:28px;background:radial-gradient(circle at top,rgba(241,196,15,.13),transparent 42%),rgba(0,0,0,.96);padding:22px;box-shadow:0 32px 110px rgba(0,0,0,.88);display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:20px;align-items:center}.modal-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;border:1px solid rgba(241,196,15,.34);box-shadow:0 20px 70px rgba(0,0,0,.72)}.modal-card h2{margin:0;color:var(--yellow);font-family:Elektrix,Inter,sans-serif;font-size:clamp(2rem,5vw,4rem);line-height:.86}.modal-card p{color:rgba(255,255,255,.78);font-weight:900;line-height:1.45}.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid rgba(241,196,15,.28);background:rgba(0,0,0,.48);border-radius:999px;padding:7px 10px;color:#fff;font-size:.75rem;font-weight:1000}.modal-actions{display:flex;gap:10px;flex-wrap:wrap}.danger{border-color:rgba(255,59,48,.35);color:#ffb4ae}.footer-note{width:min(1180px,96vw);margin:0 auto 20px;text-align:center;color:rgba(255,255,255,.52);font-weight:800;font-size:.8rem}@media(max-width:980px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.page{padding:11px}.topbar .btn{min-height:35px;padding:0 11px;font-size:.78rem}.brand{font-size:1.7rem}.hero{border-radius:22px;padding:14px}.summary{grid-template-columns:repeat(3,1fr);gap:7px}.summary-card{padding:9px 5px}.summary-card small{font-size:.52rem}.summary-card strong{font-size:1.35rem}.tabs{justify-content:stretch}.tab{flex:1;padding:0 8px;font-size:.74rem}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-height:230px;border-radius:17px;padding:9px}.card h3{font-size:.95rem}.card p{font-size:.68rem}.badge{font-size:.48rem}.modal-card{grid-template-columns:1fr;text-align:center}.modal-card img{width:min(210px,70vw);margin:auto}.modal-actions{justify-content:center}}@media(max-width:390px){.grid{grid-template-columns:1fr}.card{min-height:auto /* CBJR — Conquistas completas com XP, raridade e filtros */
.summary{grid-template-columns:repeat(5,1fr)!important}

<body>
<div class="page">
  <header class="topbar">
    <a class="btn" href="index.html?skipIntro=true">← Menu</a>
    <div class="brand">Conquistas CBJR</div>
    <a class="btn" href="ranking.html">Ranking</a>
  </header>

  <section class="hero">
    <div>
      <h1>Sua coleção de troféus</h1>
     </div>
    <div class="summary">
      <div class="summary-card"><small>Total</small><strong id="totalCount">0</strong></div>
      <div class="summary-card"><small>Liberadas</small><strong id="unlockedCount">0</strong></div>
      <div class="summary-card"><small>Bloqueadas</small><strong id="lockedCount">0</strong></div>
      <div class="summary-card"><small>XP ganho</small><strong id="xpCount">0</strong></div>
      <div class="summary-card"><small>Progresso</small><strong id="percentCount">0%</strong></div>
      <div class="progress-shell"><div id="progressFill" class="progress-fill"></div></div>
    </div>
  </section>

  <nav class="tabs" aria-label="Categorias de conquistas">
    <button class="tab active" data-filter="all">Todas</button>
    <button class="tab" data-filter="unlocked">Liberadas</button>
    <button class="tab" data-filter="locked">Bloqueadas</button>
    <button class="tab" data-filter="radio">Rádio</button>
    <button class="tab" data-filter="quiz">Quiz</button>
    <button class="tab" data-filter="letras">Letras</button>
    <button class="tab" data-filter="geral">Gerais</button>
    <button class="tab" data-filter="especial">Especiais</button>
  </nav>

  <main id="achievementsGrid" class="grid"></main>
  <p class="collection-note">O resumo aparece no menu principal. Aqui fica a coleção completa com XP, raridade, status e detalhes de desbloqueio.</p>
  <!-- Removed footer note to clean up the interface -->
  <!-- Global reset button for all achievements -->
  <div style="width:min(1180px,96vw);margin:0 auto 14px;display:flex;justify-content:flex-end;">
    <button class="btn danger" onclick="resetAchievements()" title="Limpa todas as conquistas locais">Zerar conquistas</button>
  </div>
</div>

<div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-label="Detalhe da conquista">
  <article class="modal-card">
    <img id="modalCover" src="" alt="Capa da conquista" onerror="fallbackCover(this)">
    <div>
      <h2 id="modalTitle">Conquista</h2>
      <p id="modalDesc">Descrição da conquista.</p>
      <div class="modal-meta">
        <span id="modalCategory" class="chip">Categoria</span>
        <span id="modalStatus" class="chip">Status</span>
        <span id="modalDate" class="chip">Data</span>
        <span id="modalXP" class="chip modal-xp">XP</span>
        <span id="modalRarity" class="chip">Raridade</span>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Fechar</button>
        <!-- Removed individual reset button to centralize reset on the page -->
      </div>
    </div>
  </article>
</div>

const fullCatalog = [...catalog, ...autoCatalog].map(a => {
  const xp = Number(a.xp || (a.cat === 'especial' ? 300 : a.cat === 'radio' ? 180 : a.cat === 'letras' ? 160 : a.cat === 'quiz' ? 150 : 80));
  const rarity = a.rarity || (xp >= 500 ? 'lendario' : xp >= 300 ? 'epico' : xp >= 180 ? 'raro' : 'comum');
  return {...a, xp, rarity};
});

const catNames = {all:'Todas',unlocked:'Liberadas',locked:'Bloqueadas',radio:'Rádio',quiz:'Quiz',letras:'Letras',geral:'Gerais',especial:'Especiais'};
const rarityNames = {comum:'Comum',raro:'Rara',epico:'Épica',lendario:'Lendária'};
let activeFilter = 'all';
let state = {};

function readJson(key, fallback={}){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))||fallback}catch(e){return fallback}}
function normalizeUnlockValue(value, source){
  if(!value) return null;
  if(typeof value === 'object') return {...value, source, unlockedAt:Number(value.unlockedAt || value.timestamp || value.date || Date.now())};
  return {unlockedAt:Date.now(), source};
}
function unlock(merged, id, value, source){ const data = normalizeUnlockValue(value, source); if(data) merged[id] = data; }
function normalizeLettersId(value){
  const s=String(value||'').toLowerCase();
  if(s.includes('tcp')||s.includes('transp'))return 'letters_tcp_completed';
  if(s.includes('pcpl')||s.includes('preço')||s.includes('preco'))return 'letters_pcpl_completed';
  if(s.includes('nadando')||s.includes('tubaro'))return 'letters_nadando_completed';
  if(s.includes('100'))return 'letters_cbjr100_completed';
  if(s.includes('bocas'))return 'letters_bocas_completed';
  if(s.includes('atividade')||s.includes('tamo'))return 'letters_atividade_completed';
  if(s.includes('imunidade'))return 'letters_imunidade_completed';
  if(s.includes('ritmo')||s.includes('ritual'))return 'letters_ritmo_completed';
  return '';
}
function normalizeState(){
  const radio = readJson(RADIO_KEY, {});
  const quiz = readJson(OLD_QUIZ_KEY, {});
  const auto = readJson(AUTO_KEY, {});
  const letters = readJson(LETTERS_KEY, []);
  const merged = {};
  Object.keys(quiz).forEach(id => unlock(merged,id,quiz[id],'quiz'));
  Object.keys(radio).forEach(id => unlock(merged,id,radio[id],'radio'));
  Object.keys(auto).forEach(id => unlock(merged,id,auto[id],'automatico'));
  if(Array.isArray(letters)){
    letters.forEach((item,idx)=>{ const id=normalizeLettersId(item); if(id) unlock(merged,id,{unlockedAt:Date.now()+idx, source:'letras'},'letras'); });
    if(letters.length>=13) unlock(merged,'letters_all_completed',{unlockedAt:Date.now(), source:'letras'},'letras');
  }
  return merged;
}
function encodePath(file){return String(file || 'CD 1.jpeg').replace(/^\/+/, '').split('/').map(part => encodeURIComponent(part)).join('/');}
function coverCandidates(file){
  const encoded=encodePath(file); const original=String(file||'CD 1.jpeg').replace(/^\/+/, ''); const cache='?v=20260608-achievements-xp';
  return [BASE_URL+encoded+cache,PAGES_V2+encoded+cache,RAW_V2+encoded+cache,PAGES_V1+encoded+cache,RAW_V1+encoded+cache,BASE_URL+original+cache,PAGES_V2+'cbjr.png'+cache,RAW_V2+'cbjr.png'+cache];
}
function coverUrl(file){return coverCandidates(file)[0];}
function fallbackCover(img){ if(!img)return; const original=img.dataset.originalCover||'CD 1.jpeg'; const candidates=coverCandidates(original); const step=Number(img.dataset.fallbackStep||0)+1; if(step<candidates.length){img.dataset.fallbackStep=String(step);img.src=candidates[step];return;} img.classList.add('cover-error'); }
function isUnlocked(id){ return Boolean(state[id]); }
function formatDate(value){ const ts=Number(value||0); if(!ts)return 'Data não registrada'; try{return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return 'Data não registrada'} }
function matchesFilter(a){
  if(activeFilter==='all')return true;
  if(activeFilter==='unlocked')return isUnlocked(a.id);
  if(activeFilter==='locked')return !isUnlocked(a.id);
  return a.cat===activeFilter;
}
function render(){
  state=normalizeState();
  const total=fullCatalog.length;
  const unlockedItems=fullCatalog.filter(a=>isUnlocked(a.id));
  const unlocked=unlockedItems.length;
  const locked=total-unlocked;
  const percent=total?Math.round((unlocked/total)*100):0;
  const xp=unlockedItems.reduce((sum,a)=>sum+Number(a.xp||0),0);
  document.getElementById('totalCount').textContent=total;
  document.getElementById('unlockedCount').textContent=unlocked;
  document.getElementById('lockedCount').textContent=locked;
  document.getElementById('xpCount').textContent=xp;
  document.getElementById('percentCount').textContent=percent+'%';
  document.getElementById('progressFill').style.width=percent+'%';
  const rows=fullCatalog.filter(matchesFilter).sort((a,b)=>Number(isUnlocked(b.id))-Number(isUnlocked(a.id)) || (b.xp-a.xp) || a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));
  const grid=document.getElementById('achievementsGrid');
  if(!rows.length){ grid.innerHTML='<div class="empty">Nenhuma conquista encontrada nessa categoria.</div>'; return; }
  grid.innerHTML=rows.map(a=>{
    const unlocked=isUnlocked(a.id); const data=state[a.id]||{};
    return `<article class="card ${unlocked?'unlocked':'locked'}" onclick="openModal('${a.id}')">
      <span class="badge">${catNames[a.cat]||a.cat}</span>
      <span class="icon">${unlocked ? a.icon : '🔒'}</span>
      <span class="rarity ${a.rarity}">${rarityNames[a.rarity]||a.rarity}</span>
      <img class="cover" src="${coverUrl(a.cover)}" data-original-cover="${escapeHtml(a.cover)}" alt="${escapeHtml(a.name)}" onerror="fallbackCover(this)">
      <h3>${escapeHtml(a.name)}</h3>
      <p>${escapeHtml(a.desc)}</p>
      <div class="card-meta"><span class="xp-chip">+${a.xp} XP</span></div>
      <div class="status">${unlocked ? 'Desbloqueada • ' + formatDate(data.unlockedAt) : 'Bloqueada'}</div>
    </article>`;
  }).join('');
}
function openModal(id){
  const a=fullCatalog.find(x=>x.id===id); if(!a)return; const data=state[id]||{}; const unlocked=isUnlocked(id);
  const modalImg=document.getElementById('modalCover'); modalImg.classList.remove('cover-error'); modalImg.dataset.fallbackStep='0'; modalImg.dataset.originalCover=a.cover; modalImg.src=coverUrl(a.cover);
  document.getElementById('modalTitle').textContent=a.name;
  document.getElementById('modalDesc').textContent=a.desc;
  document.getElementById('modalCategory').textContent=catNames[a.cat]||a.cat;
  document.getElementById('modalStatus').textContent=unlocked?'Desbloqueada':'Bloqueada';
  document.getElementById('modalStatus').style.color=unlocked?'var(--green)':'rgba(255,255,255,.72)';
  document.getElementById('modalDate').innerHTML=unlocked?formatDate(data.unlockedAt):'<button class="btn" onclick="playAchievement(''+id+'')">Jogue para liberar</button>';
  document.getElementById('modalXP').textContent='+'+a.xp+' XP';
  document.getElementById('modalRarity').textContent=rarityNames[a.rarity]||a.rarity;
  document.getElementById('detailModal').classList.add('show');
}
function closeModal(){document.getElementById('detailModal').classList.remove('show');}
function playAchievement(id){ const ach=fullCatalog.find(a=>a.id===id); if(!ach)return; let targetPage='index.html?skipIntro=true'; if(ach.cat==='radio')targetPage='radio.html'; if(ach.cat==='quiz')targetPage='quiz.html'; if(ach.cat==='letras')targetPage='letras.html'; if(ach.cat==='geral'||ach.cat==='especial')targetPage='index.html?skipIntro=true'; window.location.href=BASE_URL+targetPage; }
function escapeHtml(str){return String(str??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function resetAchievements(){ if(!confirm('Zerar as conquistas locais salvas neste navegador?'))return; localStorage.removeItem(RADIO_KEY); localStorage.removeItem(OLD_QUIZ_KEY); localStorage.removeItem(AUTO_KEY); localStorage.removeItem(LETTERS_KEY); closeModal(); render(); }
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;render();}));
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.renderAchievements=render;
render();
</script>

<script type="module" id="cbjr-cloud-progress-script">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyCT1btbLIMehCj3xldw5LOB-snjyF4SKhw',
    authDomain: 'ranking-cbjr.firebaseapp.com',
    databaseURL: 'https://ranking-cbjr-default-rtdb.firebaseio.com',
    projectId: 'ranking-cbjr',
    storageBucket: 'ranking-cbjr.firebasestorage.app',
    messagingSenderId: '681180179118',
    appId: '1:681180179118:web:fe10833848e8bb8194db3f',
    measurementId: 'G-QK5QE2Y1CC'
  };

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const PAGE_NAME = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  const PROGRESS_KEYS = [
    'radioCBJRUnlockedAlbumIndex_v2',
    'radioCBJRMode',
    'radioCBJR_achievements_v1',
    'cbjr_letters_completed',
    'lettersCBJR_playerName',
    'cobjr_quiz_achievements'
  ];

  let currentUser = null;
  let cloudReady = false;
  let syncing = false;
  let saveTimer = null;

  function safeJsonParse(value, fallback) {
    try { return JSON.parse(value); } catch (_) { return fallback; }
  }

  function readLocalProgress() {
    const data = {};
    PROGRESS_KEYS.forEach(key => {
      const value = localStorage.getItem(key);
      if (value !== null) data[key] = value;
    });
    return data;
  }

  function mergeObjectString(localValue, remoteValue) {
    const localObj = safeJsonParse(localValue || '{}', {});
    const remoteObj = safeJsonParse(remoteValue || '{}', {});
    return JSON.stringify({ ...remoteObj, ...localObj });
  }

  function mergeArrayString(localValue, remoteValue) {
    const localArr = safeJsonParse(localValue || '[]', []);
    const remoteArr = safeJsonParse(remoteValue || '[]', []);
    return JSON.stringify([...new Set([...(Array.isArray(remoteArr) ? remoteArr : []), ...(Array.isArray(localArr) ? localArr : [])])]);
  }

  function mergeProgress(localData, remoteData, user) {
    const merged = { ...(remoteData || {}), ...(localData || {}) };

    const localRadio = Number(localData.radioCBJRUnlockedAlbumIndex_v2 ?? 0);
    const remoteRadio = Number(remoteData.radioCBJRUnlockedAlbumIndex_v2 ?? 0);
    merged.radioCBJRUnlockedAlbumIndex_v2 = String(Math.max(Number.isFinite(localRadio) ? localRadio : 0, Number.isFinite(remoteRadio) ? remoteRadio : 0));

    merged.radioCBJR_achievements_v1 = mergeObjectString(localData.radioCBJR_achievements_v1, remoteData.radioCBJR_achievements_v1);
    merged.cobjr_quiz_achievements = mergeObjectString(localData.cobjr_quiz_achievements, remoteData.cobjr_quiz_achievements);
    merged.cbjr_letters_completed = mergeArrayString(localData.cbjr_letters_completed, remoteData.cbjr_letters_completed);

    if (!merged.lettersCBJR_playerName && user?.displayName) {
      merged.lettersCBJR_playerName = user.displayName.split(' ')[0] || user.displayName;
    }
    if (!merged.radioCBJRMode) merged.radioCBJRMode = 'normal';

    return merged;
  }

  function applyProgressToLocal(data) {
    syncing = true;
    try {
      Object.entries(data || {}).forEach(([key, value]) => {
        if (PROGRESS_KEYS.includes(key) && value !== undefined && value !== null) {
          localStorage.setItem(key, String(value));
        }
      });
    } finally {
      syncing = false;
    }
  }

  function refreshCurrentPageUI() {
    try { window.renderProgress?.(); } catch (_) {}
    try { window.showSelection?.(); } catch (_) {}
    try { window.updateLettersDashboard?.(); } catch (_) {}
    try { window.renderAchievements?.(); } catch (_) {}
    try { window.renderGrid?.(); } catch (_) {}
    try { window.renderSummary?.(); } catch (_) {}
    try { window.CBJRRanking?.reload?.(); } catch (_) {}
    try { window.dispatchEvent(new CustomEvent('cbjr-progress-loaded')); } catch (_) {}
  }

  function progressDocRef(user) {
    return doc(db, 'usuarios', user.uid, 'progresso', 'geral');
  }

  async function saveCloudProgressNow(extra = {}) {
    if (!currentUser || syncing) return;
    const payload = readLocalProgress();
    try {
      await setDoc(progressDocRef(currentUser), {
        ...payload,
        ...extra,
        uid: currentUser.uid,
        email: currentUser.email || '',
        displayName: currentUser.displayName || '',
        photoURL: currentUser.photoURL || '',
        updatedAt: serverTimestamp(),
        origem: PAGE_NAME
      }, { merge: true });
    } catch (error) {
      console.warn('CBJR cloud progress: não foi possível salvar agora.', error);
    }
  }

  function scheduleSaveCloudProgress() {
    if (!cloudReady || !currentUser || syncing) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveCloudProgressNow(), 450);
  }

  const nativeSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function patchedSetItem(key, value) {
    nativeSetItem(key, value);
    if (PROGRESS_KEYS.includes(key)) scheduleSaveCloudProgress();
  };

  window.CBJRCloudProgress = {
    keys: PROGRESS_KEYS,
    reload: async () => currentUser && loadCloudProgress(currentUser),
    save: saveCloudProgressNow,
    getLocal: readLocalProgress
  };

  async function loadCloudProgress(user) {
    currentUser = user;
    if (!user) return;

    try {
      const snap = await getDoc(progressDocRef(user));
      const remoteData = snap.exists() ? (snap.data() || {}) : {};
      const localData = readLocalProgress();
      const merged = mergeProgress(localData, remoteData, user);
      applyProgressToLocal(merged);
      cloudReady = true;
      await saveCloudProgressNow({ primeiroSync: snap.exists() ? false : true });
      refreshCurrentPageUI();
      console.info('CBJR: progresso sincronizado com a conta Google.');
    } catch (error) {
      cloudReady = true;
      console.warn('CBJR cloud progress: falha ao carregar progresso remoto.', error);
    }
  }

  onAuthStateChanged(auth, user => {
    currentUser = user || null;
    if (user) loadCloudProgress(user);
  });

  window.addEventListener('beforeunload', () => {
    if (currentUser && cloudReady) {
      try {
        const data = readLocalProgress();
        const blob = new Blob([JSON.stringify({ ...data, uid: currentUser.uid, updatedAtMs: Date.now(), origem: PAGE_NAME })], { type: 'application/json' });
        navigator.sendBeacon?.('/__cbjr_progress_ping', blob);
      } catch (_) {}
      saveCloudProgressNow();
    }
  });
</script>

</body>
</html>
