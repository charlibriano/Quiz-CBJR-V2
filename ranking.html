<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking Online CBJR</title>
<style>
@font-face{font-family:Elektrix;src:url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/Elektrix-Bold.woff2') format('woff2'),url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/Elektrix-Bold.woff') format('woff'),url('https://cdn.jsdelivr.net/gh/charlibriano/Quiz-CBJR-V2/Elektrix%20Bold.ttf') format('truetype');font-display:swap}
:root{--yellow:#f1c40f;--green:#1ed760;--red:#ff3b30;--line:rgba(241,196,15,.36);--white:#f8f8f8;--dark:#030303}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--white);background:#000;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 8%,rgba(241,196,15,.16),transparent 26%),radial-gradient(circle at 12% 85%,rgba(30,215,96,.12),transparent 30%),url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/radio-bg.png') center/cover no-repeat;filter:brightness(.35) blur(2px);transform:scale(1.04);z-index:0}body::after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.58),rgba(0,0,0,.94));z-index:1;pointer-events:none}.page{position:relative;z-index:2;min-height:100svh;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{min-height:42px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.65);color:#fff;text-decoration:none;padding:0 18px;font-weight:1000;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 22px rgba(241,196,15,.12)}.btn:hover{border-color:rgba(241,196,15,.75);box-shadow:0 0 26px rgba(241,196,15,.18)}.brand{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:clamp(2rem,5vw,4rem);text-shadow:0 0 28px rgba(241,196,15,.35);line-height:.85;text-align:center}.panel{width:min(1180px,96vw);margin:0 auto;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at top,rgba(241,196,15,.08),transparent 36%),linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.94));box-shadow:0 28px 90px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.06);padding:clamp(14px,2.4vw,28px);display:grid;gap:16px}.hero{text-align:center}.hero h1{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:clamp(2.2rem,7vw,5.5rem);line-height:.85;margin:0 0 8px}.hero p{margin:0;color:rgba(255,255,255,.78);font-weight:900}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tab{border:1px solid rgba(241,196,15,.35);background:rgba(0,0,0,.55);color:#fff;border-radius:999px;min-height:38px;padding:0 18px;font-weight:1000;cursor:pointer}.tab.active{background:linear-gradient(90deg,var(--yellow),#1ed760);color:#000;border-color:transparent}.ranking-list{display:grid;gap:10px}.rank-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid rgba(241,196,15,.20);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.62));padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.rank-row.top1{border-color:rgba(30,215,96,.65);box-shadow:0 0 34px rgba(30,215,96,.12),inset 0 1px 0 rgba(255,255,255,.08)}.pos{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:2rem;text-align:center}.who{min-width:0}.name{font-weight:1000;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:4px;color:rgba(255,255,255,.62);font-weight:800;font-size:.78rem}.score{font-weight:1000;color:#1ed760;font-size:1.1rem;text-align:right}.empty,.loading{border:1px solid rgba(241,196,15,.25);border-radius:20px;padding:20px;text-align:center;color:rgba(255,255,255,.72);font-weight:900}.footer-note{text-align:center;color:rgba(255,255,255,.58);font-weight:800;font-size:.82rem}.status{font-size:.74rem;text-align:center;color:rgba(255,255,255,.55);font-weight:800}@media(max-width:620px){.page{padding:12px}.topbar .btn{min-height:36px;padding:0 12px;font-size:.8rem}.rank-row{grid-template-columns:48px minmax(0,1fr);gap:8px}.score{grid-column:2;text-align:left}.pos{font-size:1.45rem}.panel{border-radius:22px;padding:12px}.tabs{justify-content:stretch}.tab{flex:1;padding:0 8px}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="btn" href="index.html">← Menu</a>
    <div class="brand">Ranking CBJR</div>
    <a class="btn" href="radio.html">Rádio</a>
  </header>
  <main class="panel">
    <section class="hero">
      <h1>Ouvintes da estação</h1>
      <p>Ranking online da Rádio CBJR — pontuações gravadas no Firebase.</p>
    </section>
    <nav class="tabs" aria-label="Filtros do ranking">
      <button class="tab active" data-filter="all">Geral</button>
      <button class="tab" data-filter="normal">Modo Normal</button>
      <button class="tab" data-filter="hard">Modo Hard</button>
    </nav>
    <div id="firebaseStatus" class="status">Conectando ao ranking online...</div>
    <section id="rankingList" class="ranking-list"><div class="loading">Carregando ranking online...</div></section>
    <p class="footer-note">Pontuação considera acertos, porcentagem, modo Hard, CD alcançado e bônus por desempenho perfeito.</p>
  </main>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCT1btbLIMehCj3xldw5LOB-snjyF4SKhw",authDomain:"ranking-cbjr.firebaseapp.com",projectId:"ranking-cbjr",storageBucket:"ranking-cbjr.firebasestorage.app",messagingSenderId:"681180179118",appId:"1:681180179118:web:fe10833848e8bb8194db3f",measurementId:"G-QK5QE2Y1CC"};
let rankingData=[];let activeFilter='all';let firebaseApiPromise=null;
async function getFirebaseApi(){if(firebaseApiPromise)return firebaseApiPromise;firebaseApiPromise=Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]).then(([appMod,fsMod])=>{const app=appMod.getApps().length?appMod.getApp():appMod.initializeApp(firebaseConfig);const db=fsMod.getFirestore(app);return{db,collection:fsMod.collection,getDocs:fsMod.getDocs,query:fsMod.query,where:fsMod.where,orderBy:fsMod.orderBy,limit:fsMod.limit}});return firebaseApiPromise}
function docToEntry(doc){const d=doc.data();return{id:doc.id,name:String(d.name||'Ouvinte CBJR'),score:Number(d.score||0),timestamp:Number(d.timestamp||0),gameMode:String(d.gameMode||''),source:String(d.source||''),radioMode:String(d.radioMode||''),album:String(d.album||''),albumIndex:Number(d.albumIndex||0),accuracy:Number(d.accuracy||0),correct:Number(d.correct||0),total:Number(d.total||0),wrong:Number(d.wrong||0),rankTitle:String(d.rankTitle||'')}}
async function loadRanking(){const list=document.getElementById('rankingList');const status=document.getElementById('firebaseStatus');list.innerHTML='<div class="loading">Carregando ranking online...</div>';try{const fb=await getFirebaseApi();const ref=fb.collection(fb.db,'ranking');let snap;try{snap=await fb.getDocs(fb.query(ref,fb.where('source','==','radio-cbjr-v2'),fb.orderBy('score','desc'),fb.limit(200)))}catch(e){snap=await fb.getDocs(fb.query(ref,fb.where('gameMode','==','bonus'),fb.orderBy('score','desc'),fb.limit(200)))}rankingData=snap.docs.map(docToEntry).filter(e=>e.gameMode==='bonus'||e.source==='radio-cbjr-v2').sort((a,b)=>(b.score-a.score)||(b.timestamp-a.timestamp));status.textContent='Ranking online conectado.';renderRanking()}catch(e){console.error(e);status.textContent='Falha ao conectar. Confira as regras do Firebase.';list.innerHTML='<div class="empty">Não foi possível carregar o ranking online. Confira se o Firestore está liberado para leitura.</div>'}}
function renderRanking(){const list=document.getElementById('rankingList');let rows=rankingData;if(activeFilter!=='all')rows=rows.filter(e=>e.radioMode===activeFilter);rows=rows.slice(0,100);if(!rows.length){list.innerHTML='<div class="empty">Nenhuma pontuação enviada ainda nesse filtro.</div>';return}list.innerHTML=rows.map((e,i)=>`<article class="rank-row ${i===0?'top1':''}"><div class="pos">#${i+1}</div><div class="who"><div class="name">${escapeHtml(e.name)}</div><div class="meta">${escapeHtml(e.album||'Rádio CBJR')} • ${e.accuracy||0}% • ${e.correct||0}/${e.total||0} • ${e.radioMode==='hard'?'Hard':'Normal'}</div></div><div class="score">${e.score} pts</div></article>`).join('')}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;renderRanking()}));
loadRanking();
</script>
</body>
</html>
