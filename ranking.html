<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking Online CBJR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Elektrix';src:url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/Elektrix-Bold.woff2') format('woff2'),url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/Elektrix-Bold.woff') format('woff'),url('https://cdn.jsdelivr.net/gh/charlibriano/Quiz-CBJR-V2/Elektrix%20Bold.ttf') format('truetype');font-display:swap}
:root{--yellow:#f1c40f;--green:#1ed760;--red:#ff3b30;--line:rgba(241,196,15,.38);--white:#f8f8f8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--white);font-family:Inter,Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 5%,rgba(241,196,15,.20),transparent 24%),radial-gradient(circle at 20% 65%,rgba(30,215,96,.12),transparent 28%),linear-gradient(120deg,#000,#070707 45%,#010b05);z-index:0}
body::after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9),transparent 45%,rgba(0,0,0,.9));z-index:1;pointer-events:none}
.page{position:relative;z-index:2;min-height:100svh;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{min-height:42px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.65);color:#fff;text-decoration:none;padding:0 18px;font-weight:1000;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 22px rgba(241,196,15,.12)}.brand{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:clamp(2rem,5vw,4rem);text-shadow:0 0 28px rgba(241,196,15,.35);line-height:.85;text-align:center}.panel{width:min(1180px,96vw);margin:0 auto;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at top,rgba(241,196,15,.08),transparent 36%),linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.94));box-shadow:0 28px 90px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.06);padding:clamp(14px,2.4vw,28px);display:grid;gap:16px}.hero{text-align:center}.hero h1{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:clamp(2.2rem,7vw,5.5rem);line-height:.85;margin:0 0 8px}.hero p{margin:0;color:rgba(255,255,255,.78);font-weight:900}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tab{border:1px solid rgba(241,196,15,.35);background:rgba(0,0,0,.55);color:#fff;border-radius:999px;min-height:38px;padding:0 18px;font-weight:1000;cursor:pointer}.tab.active{background:linear-gradient(90deg,var(--yellow),#1ed760);color:#000;border-color:transparent}.ranking-list{display:grid;gap:10px}.rank-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid rgba(241,196,15,.20);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.62));padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.rank-row.top1{border-color:rgba(30,215,96,.65);box-shadow:0 0 34px rgba(30,215,96,.12),inset 0 1px 0 rgba(255,255,255,.08)}.pos{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:2rem;text-align:center}.who{min-width:0}.name{font-weight:1000;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:4px;color:rgba(255,255,255,.62);font-weight:800;font-size:.78rem}.score{font-weight:1000;color:#1ed760;font-size:1.1rem;text-align:right}.empty,.loading{border:1px solid rgba(241,196,15,.25);border-radius:20px;padding:20px;text-align:center;color:rgba(255,255,255,.72);font-weight:900}.footer-note{text-align:center;color:rgba(255,255,255,.58);font-weight:800;font-size:.82rem}@media(max-width:620px){.page{padding:12px}.topbar .btn{min-height:36px;padding:0 12px;font-size:.8rem}.rank-row{grid-template-columns:48px minmax(0,1fr);gap:8px}.score{grid-column:2;text-align:left}.pos{font-size:1.45rem}.panel{border-radius:22px;padding:12px}.tabs{justify-content:stretch}.tab{flex:1;padding:0 8px}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="btn" href="index.html">← Menu</a>
    <div class="brand">Ranking CBJR</div>
    <a class="btn" href="radio.html">Rádio</a>
  </header>
  <main class="panel">
    <section class="hero">
      <h1>Ouvintes da estação</h1>
      <p>Ranking online da Rádio CBJR — pontuações enviadas pelo modo Rádio.</p>
    </section>
    <nav class="tabs" aria-label="Filtros do ranking">
      <button class="tab active" data-filter="all">Geral</button>
      <button class="tab" data-filter="normal">Modo Normal</button>
      <button class="tab" data-filter="hard">Modo Hard</button>
    </nav>
    <section id="rankingList" class="ranking-list"><div class="loading">Carregando ranking online...</div></section>
    <div class="footer-note">Pontuação considera acertos, porcentagem, modo Hard, CD alcançado e bônus por desempenho perfeito.</div>
  </main>
</div>
<script>
const FIREBASE_PROJECT_ID='ranking-cbjr';
const FIREBASE_API_KEY='AIzaSyCT1btbLIMehCj3xldw5LOB-snjyF4SKhw';
const FIRESTORE_BASE_URL=`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents`;
let rankingData=[];let activeFilter='all';
function value(field){if(!field)return'';if('stringValue'in field)return field.stringValue;if('integerValue'in field)return Number(field.integerValue||0);if('doubleValue'in field)return Number(field.doubleValue||0);return''}
function docToEntry(doc){const f=doc.fields||{};return{name:String(value(f.name)||'Ouvinte CBJR'),score:Number(value(f.score)||0),timestamp:Number(value(f.timestamp)||0),gameMode:String(value(f.gameMode)||''),source:String(value(f.source)||''),radioMode:String(value(f.radioMode)||''),album:String(value(f.album)||''),accuracy:Number(value(f.accuracy)||0),correct:Number(value(f.correct)||0),total:Number(value(f.total)||0),wrong:Number(value(f.wrong)||0),rankTitle:String(value(f.rankTitle)||'')}}
async function loadRanking(){const list=document.getElementById('rankingList');list.innerHTML='<div class="loading">Carregando ranking online...</div>';try{const res=await fetch(`${FIRESTORE_BASE_URL}/ranking?key=${FIREBASE_API_KEY}&pageSize=200`,{cache:'no-store'});if(!res.ok)throw new Error('Falha ao carregar ranking');const data=await res.json();rankingData=(data.documents||[]).map(docToEntry).filter(e=>e.gameMode==='bonus'||e.source==='radio-cbjr-v2').sort((a,b)=>(b.score-a.score)||(b.timestamp-a.timestamp));renderRanking()}catch(e){list.innerHTML='<div class="empty">Não foi possível carregar o ranking online. Confira as regras do Firebase.</div>'}}
function renderRanking(){const list=document.getElementById('rankingList');let rows=rankingData;if(activeFilter!=='all')rows=rows.filter(e=>e.radioMode===activeFilter);rows=rows.slice(0,100);if(!rows.length){list.innerHTML='<div class="empty">Nenhuma pontuação enviada ainda nesse filtro.</div>';return}list.innerHTML=rows.map((e,i)=>`<article class="rank-row ${i===0?'top1':''}"><div class="pos">#${i+1}</div><div class="who"><div class="name">${escapeHtml(e.name)}</div><div class="meta">${escapeHtml(e.album||'Rádio CBJR')} • ${e.accuracy||0}% • ${e.correct||0}/${e.total||0} • ${e.radioMode==='hard'?'Hard':'Normal'}</div></div><div class="score">${e.score} pts</div></article>`).join('')}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;renderRanking()}));
loadRanking();
</script>
</body>
</html>
