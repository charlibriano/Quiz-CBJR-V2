<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking Online CBJR</title>
<style>
@font-face{font-family:Elektrix;src:url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/Elektrix-Bold.woff2') format('woff2'),url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/Elektrix-Bold.woff') format('woff'),url('https://cdn.jsdelivr.net/gh/charlibriano/Quiz-CBJR-V2/Elektrix%20Bold.ttf') format('truetype');font-display:swap}
:root{--yellow:#f1c40f;--green:#1ed760;--red:#ff3b30;--line:rgba(241,196,15,.36);--white:#f8f8f8;--dark:#030303}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--white);background:#000;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 8%,rgba(241,196,15,.16),transparent 26%),radial-gradient(circle at 12% 85%,rgba(30,215,96,.12),transparent 30%),url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/radio-bg.png') center/cover no-repeat;filter:brightness(.35) blur(2px);transform:scale(1.04);z-index:0}body::after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.58),rgba(0,0,0,.94));z-index:1;pointer-events:none}.page{position:relative;z-index:2;min-height:100svh;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{min-height:42px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.65);color:#fff;text-decoration:none;padding:0 18px;font-weight:1000;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 22px rgba(241,196,15,.12)}.btn:hover{border-color:rgba(241,196,15,.75);box-shadow:0 0 26px rgba(241,196,15,.18)}.brand{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:clamp(2rem,5vw,4rem);text-shadow:0 0 28px rgba(241,196,15,.35);line-height:.85;text-align:center}.panel{width:min(1180px,96vw);margin:0 auto;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at top,rgba(241,196,15,.08),transparent 36%),linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.94));box-shadow:0 28px 90px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.06);padding:clamp(14px,2.4vw,28px);display:grid;gap:16px}.hero{text-align:center}.hero h1{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:clamp(2.2rem,7vw,5.5rem);line-height:.85;margin:0 0 8px}.hero p{margin:0;color:rgba(255,255,255,.78);font-weight:900}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tab{border:1px solid rgba(241,196,15,.35);background:rgba(0,0,0,.55);color:#fff;border-radius:999px;min-height:38px;padding:0 18px;font-weight:1000;cursor:pointer}.tab.active{background:linear-gradient(90deg,var(--yellow),#1ed760);color:#000;border-color:transparent}.ranking-list{display:grid;gap:10px}.rank-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid rgba(241,196,15,.20);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.62));padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.rank-row.top1{border-color:rgba(30,215,96,.65);box-shadow:0 0 34px rgba(30,215,96,.12),inset 0 1px 0 rgba(255,255,255,.08)}.pos{font-family:Elektrix,Inter,sans-serif;color:var(--yellow);font-size:2rem;text-align:center}.who{min-width:0}.name{font-weight:1000;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:4px;color:rgba(255,255,255,.62);font-weight:800;font-size:.78rem}.score{font-weight:1000;color:#1ed760;font-size:1.1rem;text-align:right}.empty,.loading{border:1px solid rgba(241,196,15,.25);border-radius:20px;padding:20px;text-align:center;color:rgba(255,255,255,.72);font-weight:900}.footer-note{text-align:center;color:rgba(255,255,255,.58);font-weight:800;font-size:.82rem}.status{font-size:.74rem;text-align:center;color:rgba(255,255,255,.55);font-weight:800}.date{color:rgba(255,255,255,.74)}@media(max-width:620px){.page{padding:12px}.topbar .btn{min-height:36px;padding:0 12px;font-size:.8rem}.rank-row{grid-template-columns:48px minmax(0,1fr);gap:8px}.score{grid-column:2;text-align:left}.pos{font-size:1.45rem}.panel{border-radius:22px;padding:12px}.tabs{justify-content:stretch}.tab{flex:1;padding:0 8px}.brand{font-size:1.55rem}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="btn" href="index.html?skipIntro=true">← Menu</a>
    <div class="brand">Ranking CBJR</div>
    <a class="btn" href="radio.html">Rádio</a>
  </header>
  <main class="panel">
    <section class="hero">
      <h1>Ouvintes da estação</h1>
      <p>Ranking online CBJR — pontuações gravadas no Firebase com data da jogada.</p>
    </section>
    <nav class="tabs" aria-label="Filtros do ranking">
      <button class="tab active" data-filter="all">Geral</button>
      <button class="tab" data-filter="quiz">Quiz</button>
      <button class="tab" data-filter="radio">Rádio</button>
      <button class="tab" data-filter="letras">Letras</button>
      <button class="tab" data-filter="normal">Normal</button>
      <button class="tab" data-filter="hard">Hard</button>
    </nav>
    <div id="firebaseStatus" class="status">Conectando ao ranking online...</div>
    <section id="rankingList" class="ranking-list"><div class="loading">Carregando ranking online...</div></section>
    <p class="footer-note">Agora o ranking aceita pontuação do Quiz, Rádio e Modo Letras, ordena por maior pontuação e mostra a data.</p>
  </main>
</div>
<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
  apiKey:'AIzaSyCT1btbLIMehCj3xldw5LOB-snjyF4SKhw',
  authDomain:'ranking-cbjr.firebaseapp.com',
  projectId:'ranking-cbjr',
  storageBucket:'ranking-cbjr.firebasestorage.app',
  messagingSenderId:'681180179118',
  appId:'1:681180179118:web:fe10833848e8bb8194db3f',
  measurementId:'G-QK5QE2Y1CC'
};

const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getFirestore(app);
const COLLECTION_NAME='ranking';
let rankingData=[];
let activeFilter='all';

function normalizeText(v,fallback=''){return String(v ?? fallback).trim();}
function normalizeNumber(v,fallback=0){const n=Number(v);return Number.isFinite(n)?n:fallback;}
function normalizeDateValue(v){
  if(!v)return Date.now();
  if(typeof v==='number')return v;
  if(typeof v==='string'){const t=Date.parse(v);return Number.isFinite(t)?t:Date.now();}
  if(typeof v.toMillis==='function')return v.toMillis();
  if(v.seconds)return v.seconds*1000;
  return Date.now();
}
function formatDate(ts){
  const d=new Date(ts);
  if(Number.isNaN(d.getTime()))return 'Data não informada';
  return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
}
function detectGameMode(d){
  const source=normalizeText(d.source||d.gameSource||d.origin).toLowerCase();
  const gameMode=normalizeText(d.gameMode||d.mode||d.tipo).toLowerCase();
  if(source.includes('radio')||gameMode.includes('radio'))return 'radio';
  if(source.includes('letra')||gameMode.includes('letra'))return 'letras';
  if(source.includes('quiz')||gameMode.includes('quiz'))return 'quiz';
  return gameMode || 'quiz';
}
function docToEntry(docSnap){
  const d=docSnap.data()||{};
  const createdAt=normalizeDateValue(d.createdAt||d.date||d.data||d.timestamp||d.playedAt);
  const radioMode=normalizeText(d.radioMode||d.difficulty||d.dificuldade||d.nivel||d.mode).toLowerCase();
  const game=detectGameMode(d);
  return{
    id:docSnap.id,
    name:normalizeText(d.name||d.playerName||d.nome||d.jogador,'Ouvinte CBJR'),
    score:normalizeNumber(d.score||d.pontos||d.points||d.pontuacao),
    createdAt,
    game,
    radioMode,
    album:normalizeText(d.album||d.cd||d.category||d.categoria||d.rankTitle, game==='quiz'?'Quiz CBJR':game==='letras'?'Modo Letras':'Rádio CBJR'),
    accuracy:normalizeNumber(d.accuracy||d.percentual||d.aproveitamento),
    correct:normalizeNumber(d.correct||d.acertos),
    total:normalizeNumber(d.total||d.perguntas||d.musicas),
    wrong:normalizeNumber(d.wrong||d.erros)
  };
}
function entryMatchesFilter(e){
  if(activeFilter==='all')return true;
  if(['quiz','radio','letras'].includes(activeFilter))return e.game===activeFilter;
  if(['normal','hard'].includes(activeFilter))return e.radioMode===activeFilter;
  return true;
}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function modeLabel(e){
  if(e.radioMode==='hard')return 'Hard';
  if(e.radioMode==='normal')return 'Normal';
  if(e.game==='radio')return 'Rádio';
  if(e.game==='letras')return 'Letras';
  return 'Quiz';
}
function renderRanking(){
  const list=document.getElementById('rankingList');
  const rows=rankingData.filter(entryMatchesFilter).slice(0,100);
  if(!rows.length){list.innerHTML='<div class="empty">Nenhuma pontuação enviada ainda nesse filtro.</div>';return;}
  list.innerHTML=rows.map((e,i)=>`<article class="rank-row ${i===0?'top1':''}"><div class="pos">#${i+1}</div><div class="who"><div class="name">${escapeHtml(e.name)}</div><div class="meta">${escapeHtml(e.album)} • ${e.accuracy||0}% • ${e.correct||0}/${e.total||0} • ${modeLabel(e)} • <span class="date">${formatDate(e.createdAt)}</span></div></div><div class="score">${e.score} pts</div></article>`).join('');
}
async function loadRanking(){
  const list=document.getElementById('rankingList');
  const status=document.getElementById('firebaseStatus');
  list.innerHTML='<div class="loading">Carregando ranking online...</div>';
  try{
    const snap=await getDocs(collection(db,COLLECTION_NAME));
    rankingData=snap.docs.map(docToEntry).sort((a,b)=>(b.score-a.score)||(b.createdAt-a.createdAt));
    status.textContent=`Ranking online conectado. ${rankingData.length} pontuação(ões) encontrada(s).`;
    renderRanking();
  }catch(error){
    console.error(error);
    status.textContent='Falha ao conectar. Confira se o Firestore Database foi criado e se as regras permitem leitura.';
    list.innerHTML='<div class="empty">Não foi possível carregar o ranking online. O problema normalmente está nas regras do Firestore ou no banco ainda não criado.</div>';
  }
}
async function salvarPontuacaoRanking(payload={}){
  const cleanName=normalizeText(payload.name||payload.playerName||payload.nome||payload.jogador,'Ouvinte CBJR').slice(0,32);
  const score=normalizeNumber(payload.score||payload.pontos||payload.points||payload.pontuacao);
  const game=detectGameMode(payload);
  const data={
    name:cleanName,
    score,
    gameMode:game,
    source:normalizeText(payload.source||`cbjr-v2-${game}`),
    radioMode:normalizeText(payload.radioMode||payload.difficulty||payload.dificuldade||payload.nivel||payload.mode).toLowerCase(),
    album:normalizeText(payload.album||payload.cd||payload.category||payload.categoria||payload.rankTitle, game==='quiz'?'Quiz CBJR':game==='letras'?'Modo Letras':'Rádio CBJR'),
    accuracy:normalizeNumber(payload.accuracy||payload.percentual||payload.aproveitamento),
    correct:normalizeNumber(payload.correct||payload.acertos),
    total:normalizeNumber(payload.total||payload.perguntas||payload.musicas),
    wrong:normalizeNumber(payload.wrong||payload.erros),
    timestamp:Date.now(),
    createdAt:serverTimestamp()
  };
  await addDoc(collection(db,COLLECTION_NAME),data);
  return data;
}
window.salvarPontuacaoRanking=salvarPontuacaoRanking;
window.CBJRRanking={save:salvarPontuacaoRanking,reload:loadRanking};

document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;renderRanking();}));
loadRanking();
</script>
</body>
</html>
